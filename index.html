<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#111a32"><title>とことん連鎖 Ver.5</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#071a3a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;touch-action:none}main{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;padding:calc(env(safe-area-inset-top) + 6px) 8px calc(env(safe-area-inset-bottom) + 6px)}header{flex-shrink:0;width:min(96vw,430px);display:flex;align-items:center;justify-content:space-between;gap:8px}h1{font-size:20px;margin:0}small{font-size:11px;color:#b9c8e7}.stats{display:flex;gap:10px;font-size:13px}.stats strong{display:block;font-size:19px}.boardwrap{position:relative;width:min(96vw,430px);flex:1;min-height:0;display:flex;justify-content:center;align-items:center}canvas{display:block;max-width:100%;max-height:100%;touch-action:none;filter:drop-shadow(0 3px 10px #0006)}.bar{flex-shrink:0;width:min(96vw,430px);display:flex;gap:8px;align-items:center;justify-content:space-between}.bar button,.overlay button{background:#304f88;border:1px solid #7699d2;border-radius:16px;color:white;font-weight:700;padding:10px 14px;font-size:14px}.bar button:active,.overlay button:active{background:#5575ad}.hint{font-size:12px;text-align:center;color:#c3d3f1;line-height:1.5}.overlay{position:absolute;inset:0;background:#0a1425d9;display:flex;align-items:center;justify-content:center;z-index:3;border-radius:14px}.panel{background:#182a48;border:1px solid #6486c1;border-radius:18px;padding:24px 18px;text-align:center;width:85%;max-width:320px}.panel h2{margin:0 0 10px;font-size:24px}.panel p{font-size:13px;line-height:1.7;color:#d1ddf2}.panel button{margin-top:8px}.hidden{display:none!important}</style></head><body><main><header><div><h1>とことん連鎖</h1></div><div class="stats"><div><small>SCORE</small><strong id="score">0</strong></div><div><small>BEST</small><strong id="best">0</strong></div></div></header><div class="boardwrap" id="wrap"><canvas id="game" width="410" height="650" aria-label="ゲーム盤面"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="overlayTitle">とことん連鎖</h2><p id="overlayText">左右スワイプ：移動<br>下スワイプ：高速落下（指を離すと通常速度）<br>右半分タップ：右回転<br>左半分タップ：左回転<br><br>同じ色を4つ以上つなげて消そう</p><button id="start">スタート</button></div></div></div><div class="bar"><button id="pause">一時停止</button><button id="reset">最初から</button></div></main><script>
(()=>{'use strict';const C=6,R=12,H=2,ROWS=R+H,S=48,OX=18,OY=16,boardX=OX,boardY=OY+H*S;const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');const el=id=>document.getElementById(id);const colors=['#f04f64','#4789f6','#45ce87','#f3ca48'];let grid,pair,next,score=0,best=0,chain=0,playing=false,paused=false,phase='fall',dropTimer=0,lastTime=0,lockTimer=0,animTimer=0,clearing=[],clearBonus=1,softDrop=false,particles=[],tick=0;try{best=+(localStorage.getItem('chain-best')||0)}catch{}el('best').textContent=best;const rand=()=>Math.floor(Math.random()*4);const make=()=>[rand(),rand()];function spawn(){pair={x:2,y:1,dir:0,c:next};next=make();lockTimer=0;phase='fall';if(!fits(pair.x,pair.y,pair.dir)){gameOver()}}function parts(x=pair.x,y=pair.y,d=pair.dir){return [[x,y,pair.c[0]],[x+[0,1,0,-1][d],y+[-1,0,1,0][d],pair.c[1]]]}function fits(x,y,d){return parts(x,y,d).every(([a,b])=>a>=0&&a<C&&b<ROWS&&(b<0||grid[b][a]===null))}function move(dx,dy){if(phase!=='fall'||!playing||paused)return false;if(fits(pair.x+dx,pair.y+dy,pair.dir)){pair.x+=dx;pair.y+=dy;if(dx&&fits(pair.x,pair.y+1,pair.dir))lockTimer=0;return true}return false}function rotate(dir){if(phase!=='fall'||!playing||paused)return;const nd=(pair.dir+dir+4)%4;for(const [dx,dy] of [[0,0],[-1,0],[1,0],[0,-1],[0,-2]]){if(fits(pair.x+dx,pair.y+dy,nd)){pair.x+=dx;pair.y+=dy;pair.dir=nd;if(fits(pair.x,pair.y+1,pair.dir))lockTimer=0;return}}}function lock(){for(const [x,y,c] of parts()){if(y<0){gameOver();return}grid[y][x]=c}pair=null;chain=0;scan()}function scan(){const visited=Array.from({length:ROWS},()=>Array(C).fill(false)),found=[],sizes=[],colorSet=new Set();for(let y=0;y<ROWS;y++)for(let x=0;x<C;x++){const c=grid[y][x];if(c===null||visited[y][x])continue;const group=[],q=[[x,y]];visited[y][x]=true;for(let k=0;k<q.length;k++){const [a,b]=q[k];group.push([a,b]);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=a+dx,ny=b+dy;if(nx>=0&&nx<C&&ny>=0&&ny<ROWS&&!visited[ny][nx]&&grid[ny][nx]===c){visited[ny][nx]=true;q.push([nx,ny])}}}if(group.length>=4){found.push(...group);sizes.push(group.length);colorSet.add(c)}}if(found.length){chain++;clearing=found;phase='clear';animTimer=0;const chainTable=[0,0,8,16,32,64,96,128,160,192,224,256,288,320,352,384,416,448,480,512];const chainBonus=chainTable[Math.min(chain,19)]||0;const colorBonus=[0,0,3,6,12][colorSet.size]||0;const groupBonus=sizes.reduce((a,n)=>a+(n===4?0:n<=10?n-3:10),0);clearBonus=Math.max(1,chainBonus+colorBonus+groupBonus);score+=10*found.length*clearBonus;el('score').textContent=score.toLocaleString('ja-JP');if(score>best){best=score;el('best').textContent=best.toLocaleString('ja-JP');try{localStorage.setItem('chain-best',best)}catch{}}}else{spawn()}}function settle(){for(let x=0;x<C;x++){let target=ROWS-1;for(let y=ROWS-1;y>=0;y--){if(grid[y][x]!==null){grid[target][x]=grid[y][x];if(target!==y)grid[y][x]=null;target--}}for(let y=target;y>=0;y--)grid[y][x]=null}scan()}function init(){grid=Array.from({length:ROWS},()=>Array(C).fill(null));score=0;el('score').textContent='0';next=make();playing=true;paused=false;dropTimer=0;lastTime=0;tick=0;softDrop=false;spawn();el('overlay').classList.add('hidden');el('pause').textContent='一時停止'}function gameOver(){playing=false;show('ゲームオーバー',`スコア：${score.toLocaleString('ja-JP')}<br>最高得点：${best.toLocaleString('ja-JP')}`,'もう一度')}function show(title,html,btn){el('overlayTitle').textContent=title;el('overlayText').innerHTML=html;el('start').textContent=btn;el('overlay').classList.remove('hidden')}function drawOrb(x,y,c,alpha=1,scale=1){
 const px=OX+x*S+S/2,py=OY+y*S+S/2;
 if(py<OY-24)return;
 ctx.save();ctx.globalAlpha=alpha;ctx.translate(px,py);ctx.scale(scale,scale);
 const dark=['#aa2139','#1c49a6','#14824c','#bc8310'];
 const base=colors[c];
 ctx.shadowColor='#050e2499';ctx.shadowBlur=3;ctx.shadowOffsetY=2;
 const g=ctx.createRadialGradient(-9,-12,1,1,4,24);
 g.addColorStop(0,'#ffffff');g.addColorStop(.10,base);g.addColorStop(.72,base);g.addColorStop(1,dark[c]);
 ctx.fillStyle=g;ctx.strokeStyle=dark[c];ctx.lineWidth=2;
 ctx.beginPath();ctx.arc(0,0,21,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 // Two oversized, slightly inward-looking eyes with colored pupils.
 for(const ex of [-8,8]){
   ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(ex,-1,8.5,9.8,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#17213b';ctx.beginPath();ctx.ellipse(ex+(ex<0?2:-2),.7,4.5,6,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ex+(ex<0?1:-3),-2.5,1.9,0,Math.PI*2);ctx.fill();
 }
 ctx.fillStyle='#ffffffb5';ctx.beginPath();ctx.ellipse(-8,-13,5,2.7,-.5,0,Math.PI*2);ctx.fill();
 ctx.restore();
}function draw(){ctx.clearRect(0,0,410,650);ctx.fillStyle='#1b3153';roundRect(OX-6,OY+H*S-6,C*S+12,R*S+12,12);ctx.fill();ctx.save();ctx.beginPath();ctx.rect(OX,boardY,C*S,R*S);ctx.clip();for(let y=H;y<ROWS;y++)for(let x=0;x<C;x++){ctx.fillStyle=(x+y)%2?'#112f55':'#14345e';ctx.fillRect(OX+x*S,OY+y*S,S-1,S-1);if(grid&&grid[y][x]!==null){let alpha=1;if(phase==='clear'&&clearing.some(([a,b])=>a===x&&b===y))alpha=.3+.7*Math.abs(Math.sin(animTimer/75));drawOrb(x,y,grid[y][x],alpha)}}if(pair&&phase==='fall'){let gy=pair.y;while(fits(pair.x,gy+1,pair.dir))gy++;for(const [x,y,c] of parts(pair.x,gy,pair.dir))if(y>=H)drawOrb(x,y,c,.22);for(const [x,y,c] of parts())if(y>=H)drawOrb(x,y,c)}ctx.restore();ctx.fillStyle='#d3e9ff';ctx.font='bold 18px system-ui';ctx.fillText('NEXT',OX+C*S+9,50);if(next){next.forEach((c,i)=>drawOrb(6.5,i+1,c,1,.82))}if(chain>1&&phase==='clear'){ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='bold 32px system-ui';ctx.shadowColor='#111';ctx.shadowBlur=7;ctx.fillText(`${chain}連鎖!`,OX+C*S/2,boardY+R*S/2);ctx.shadowBlur=0;ctx.textAlign='start'}}function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function frame(t){const dt=Math.min(50,t-(lastTime||t));lastTime=t;if(playing&&!paused){tick+=dt;if(phase==='fall'){dropTimer+=dt;const speed=softDrop?42:Math.max(140,850-Math.floor(score/2500)*60);if(dropTimer>=speed){dropTimer%=speed;move(0,1)}if(!fits(pair.x,pair.y+1,pair.dir)){lockTimer+=dt;if(lockTimer>=500)lock()}else lockTimer=0}else if(phase==='clear'){animTimer+=dt;if(animTimer>=380){for(const [x,y] of clearing)grid[y][x]=null;clearing=[];phase='settle';animTimer=0}}else if(phase==='settle'){animTimer+=dt;if(animTimer>=180)settle()}}draw();requestAnimationFrame(frame)}function fitCanvas(){const wrap=el('wrap');const availableW=wrap.clientWidth,availableH=wrap.clientHeight;const scale=Math.min(availableW/410,availableH/650);canvas.style.width=`${410*scale}px`;canvas.style.height=`${650*scale}px`}window.addEventListener('resize',fitCanvas);setTimeout(fitCanvas,20);el('start').onclick=init;el('reset').onclick=()=>{paused=false;show('最初から始める？','現在の得点はリセットされます。','新しいゲーム')};el('pause').onclick=()=>{if(!playing)return;paused=!paused;el('pause').textContent=paused?'再開':'一時停止';if(paused)show('一時停止','再開すると続きから遊べます。','再開');else el('overlay').classList.add('hidden')};el('start').addEventListener('click',()=>{});el('overlay').addEventListener('click',e=>{if(e.target.id==='start'&&paused){/* handled below */}});const startButton=el('start');startButton.onclick=()=>{if(paused){paused=false;el('pause').textContent='一時停止';el('overlay').classList.add('hidden')}else init()};let sx=0,sy=0,lastX=0,st=0,used=false,activePointer=null;
const cellWidth=()=>canvas.getBoundingClientRect().width*48/410;
canvas.addEventListener('pointerdown',e=>{
 if(!playing||paused||activePointer!==null)return;
 e.preventDefault();activePointer=e.pointerId;
 sx=lastX=e.clientX;sy=e.clientY;st=performance.now();used=false;
 canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
 if(!playing||paused||activePointer!==e.pointerId)return;
 const dx=e.clientX-lastX, totalX=e.clientX-sx,dy=e.clientY-sy,cell=cellWidth();
 if(softDrop)return;
 if(dy>cell*.7&&dy>Math.abs(totalX)*1.15){
  softDrop=true;dropTimer=0;move(0,1);used=true;return;
 }
 if(Math.abs(totalX)>cell*.25&&Math.abs(totalX)>Math.abs(dy)*.8){
  const step=cell*.65,n=Math.trunc(dx/step);
  if(n){for(let i=0;i<Math.abs(n);i++)move(Math.sign(n),0);lastX+=n*step;used=true;}
 }
});
function endPointer(e,cancelled=false){
 if(activePointer!==e.pointerId)return;
 const wasDrop=softDrop;softDrop=false;
 if(!cancelled&&!used&&!wasDrop&&performance.now()-st<450&&Math.hypot(e.clientX-sx,e.clientY-sy)<Math.max(14,cellWidth()*.3)){
  const rect=canvas.getBoundingClientRect();
  rotate(e.clientX<rect.left+rect.width/2?-1:1);
 }
 activePointer=null;
}
canvas.addEventListener('pointerup',e=>endPointer(e));
canvas.addEventListener('pointercancel',e=>endPointer(e,true));
window.addEventListener('blur',()=>{softDrop=false;activePointer=null});
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')move(-1,0);if(e.key==='ArrowRight')move(1,0);if(e.key==='ArrowDown')move(0,1);if(e.key==='ArrowUp'||e.key===' ')rotate(1);if(e.key==='z')rotate(-1)});requestAnimationFrame(frame)})();
</script></body></html>
